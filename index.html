<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero AySA - Hurlingham</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-btn.active { border-color: #06b6d4; color: #22d3ee; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header / Navbar -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <div>
                        <h1 class="text-xl font-bold text-white tracking-tight">Planta Depuradora Hurlingham</h1>
                        <p class="text-xs text-slate-400">Tablero Gerencial de Control (AySA)</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <span id="dataSourceLabel" class="text-xs font-medium px-3 py-1.5 bg-slate-800 text-slate-300 rounded-full border border-slate-700">
                        Esperando datos...
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Pestañas de Navegación -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="flex space-x-1 border-b border-slate-800 overflow-x-auto no-scrollbar">
            <!-- Pestaña 1: Resumen General -->
            <button onclick="openTab('tab-resumen', event)" class="tab-btn border-cyan-500 text-cyan-400 hover:text-cyan-300 py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Resumen General
            </button>
            
            <!-- Pestaña 2: Proceso -->
            <button onclick="openTab('tab-proceso', event)" class="tab-btn border-transparent text-slate-400 hover:text-slate-300 py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="activity" class="w-4 h-4"></i> Proceso
            </button>

            <!-- Pestaña 3: Funcionamiento -->
            <button onclick="openTab('tab-funcionamiento', event)" class="tab-btn border-transparent text-slate-400 hover:text-slate-300 py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="settings" class="w-4 h-4"></i> Funcionamiento
            </button>

            <!-- Pestaña 4: Mantenimiento -->
            <button onclick="openTab('tab-mantenimiento', event)" class="tab-btn border-transparent text-slate-400 hover:text-slate-300 py-4
